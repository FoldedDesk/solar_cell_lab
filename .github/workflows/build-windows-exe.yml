name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller -F -w -n solar_cell_lab main.py --collect-all openpyxl --collect-all et_xmlfile --collect-all matplotlib --collect-all PIL --add-data "res;res"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: solar_cell_lab-windows-exe
          path: dist/solar_cell_lab.exe
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/solar_cell_lab.exe
