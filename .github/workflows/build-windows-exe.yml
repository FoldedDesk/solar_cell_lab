name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows7:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Install dependencies (Win7 compatible set)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-win7.txt
          pip install pyinstaller==5.13.2

      - name: Build Win7 EXE
        run: |
          pyinstaller -F -w -n solar_cell_lab_win7 main.py --collect-all openpyxl --collect-all et_xmlfile --collect-all matplotlib --collect-all PIL --add-data "res;res"

      - name: Upload Win7 artifact
        uses: actions/upload-artifact@v4
        with:
          name: solar_cell_lab-windows7-exe
          path: dist/solar_cell_lab_win7.exe
          if-no-files-found: error

      - name: Attach Win7 EXE to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/solar_cell_lab_win7.exe
